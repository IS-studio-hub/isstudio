<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IS - Experience House</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/scrollbars.css">
  <style>
    :root {
      --bg: #F7E491;
      --fg: #CE4127;
      --muted: rgba(206, 65, 39, 0.72);
      --border: rgba(206, 65, 39, 1);
      --dot: #CE4127;
      --gutter: clamp(16px, 6vw, 140px);
      --vh: 1vh;
      --sidebar-top: clamp(72px, 10vh, 96px);
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, sans-serif;
    }

    body.lt-project-page--live {
      overflow-x: clip;
      overflow-y: auto;
    }

    html, body, a, button { cursor: none !important; }
    .project-accordion__trigger { cursor: none !important; }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      min-height: calc(var(--vh) * 100);
      overflow: visible;
      background: var(--bg);
    }

    .center {
      position: relative;
      pointer-events: none;
      z-index: 1;
      padding-top: clamp(64px, 9vh, 88px);
      padding-bottom: clamp(88px, 11vh, 120px);
    }

    .stack {
      pointer-events: auto;
      width: 100%;
      box-sizing: border-box;
    }

    .project-content {
      width: 100%;
    }

    /* —— Split layout: scroll left, sticky right —— */
    .project-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(24px, 4vw, 72px);
      align-items: start;
      padding-left: clamp(12px, 2vw, 32px);
      padding-right: var(--gutter);
      max-width: 1800px;
    }

    .project-layout__left {
      min-width: 0;
      width: 100%;
    }

    .project-layout__right {
      position: sticky;
      top: var(--sidebar-top);
      align-self: start;
      min-width: 0;
      max-height: calc(100dvh - var(--sidebar-top) - clamp(24px, 4vh, 40px));
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    /* Photo grid — 6-column base for 3-up and 2-up rows */
    .project-gallery {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(10px, 1.2vw, 14px);
      align-items: start;
      width: 100%;
    }

    .project-gallery__item {
      margin: 0;
      border-radius: clamp(8px, 1vw, 12px);
      overflow: hidden;
      background: rgba(206, 65, 39, 0.05);
    }

    .project-gallery__item--wide {
      grid-column: 1 / -1;
    }

    .project-gallery__item--half {
      grid-column: span 3;
    }

    .project-gallery__item--third {
      grid-column: span 2;
    }

    .project-gallery__item:not(.project-gallery__item--wide):not(.project-gallery__item--half):not(.project-gallery__item--third) {
      grid-column: span 3;
    }

    .project-gallery__item--tall {
      grid-row: span 2;
    }

    .project-gallery__item img,
    .project-gallery__item video {
      display: block;
      width: 100%;
      vertical-align: middle;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* Marketing / UI composites — show full image, no crop */
    .project-gallery__item--contain img,
    .project-gallery__item--contain video {
      height: auto;
      object-fit: contain;
    }

    /* Lifestyle photos — fill slot with cover */
    .project-gallery__item:not(.project-gallery__item--contain) img,
    .project-gallery__item:not(.project-gallery__item--contain) video {
      height: 100%;
      object-fit: cover;
    }

    .project-gallery__item--wide:not(.project-gallery__item--contain) img,
    .project-gallery__item--wide:not(.project-gallery__item--contain) video {
      aspect-ratio: 16 / 9;
    }

    .project-gallery__item--third:not(.project-gallery__item--contain) img,
    .project-gallery__item--third:not(.project-gallery__item--contain) video {
      aspect-ratio: 4 / 5;
    }

    .project-gallery__item--half:not(.project-gallery__item--contain) img,
    .project-gallery__item--half:not(.project-gallery__item--contain) video {
      aspect-ratio: 16 / 9;
    }

    .project-gallery__item--tall:not(.project-gallery__item--contain) img,
    .project-gallery__item--tall:not(.project-gallery__item--contain) video {
      aspect-ratio: 3 / 4;
      min-height: 100%;
    }

    .project-gallery__item:not(.project-gallery__item--wide):not(.project-gallery__item--half):not(.project-gallery__item--third):not(.project-gallery__item--tall):not(.project-gallery__item--contain) img,
    .project-gallery__item:not(.project-gallery__item--wide):not(.project-gallery__item--half):not(.project-gallery__item--third):not(.project-gallery__item--tall):not(.project-gallery__item--contain) video {
      aspect-ratio: 4 / 5;
    }

    .project-gallery__caption {
      padding: 0.65rem 0.85rem;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(206, 65, 39, 0.06);
    }

    /* Sticky sidebar — Senior UX portfolio */
    .project-sidebar {
      display: flex;
      flex-direction: column;
      gap: clamp(1.25rem, 2.5vh, 1.75rem);
      padding: clamp(0.25rem, 1vw, 0.5rem) 0;
    }

    .project-sidebar__eyebrow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .project-sidebar__number {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .project-sidebar__divider {
      width: 24px;
      height: 1px;
      background: rgba(206, 65, 39, 0.35);
    }

    .project-sidebar__title {
      margin: 0;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(2.5rem, 5.5vw, 4.25rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--fg);
    }

    .project-sidebar__tagline {
      margin: -0.35rem 0 0;
      font-size: clamp(0.95rem, 1.35vw, 1.1rem);
      font-weight: 600;
      line-height: 1.35;
      color: var(--fg);
      opacity: 0.9;
    }

    .project-sidebar__overview {
      margin: 0;
      font-size: clamp(0.88rem, 1.05vw, 0.98rem);
      line-height: 1.65;
      color: var(--fg);
    }

    /* Accordion */
    .project-accordion {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(206, 65, 39, 0.22);
    }

    .project-accordion__item {
      border-bottom: 1px solid rgba(206, 65, 39, 0.22);
    }

    .project-accordion__trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 0;
      margin: 0;
      border: 0;
      background: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: left;
      cursor: none !important;
      transition: opacity 0.2s ease;
    }

    .project-accordion__trigger:hover {
      opacity: 0.7;
    }

    .project-accordion__label {
      flex: 1;
      min-width: 0;
    }

    .project-accordion__icon {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      position: relative;
      transition: transform 0.3s ease;
    }

    .project-accordion__icon::before,
    .project-accordion__icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 1.5px;
      background: currentColor;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .project-accordion__icon::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .project-accordion__item.is-open .project-accordion__icon::after {
      transform: translate(-50%, -50%) rotate(90deg) scaleX(0);
      opacity: 0;
    }

    .project-accordion__panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .project-accordion__item.is-open .project-accordion__panel {
      grid-template-rows: 1fr;
    }

    .project-accordion__content {
      overflow: hidden;
      min-height: 0;
      padding-bottom: 0;
      transition: padding-bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .project-accordion__item.is-open .project-accordion__content {
      padding-bottom: 1rem;
    }

    .project-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem 1.25rem;
      padding: 0;
      border: 0;
    }

    .project-meta__label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .project-meta__value {
      display: block;
      font-size: 0.88rem;
      line-height: 1.4;
      color: var(--fg);
    }

    .project-meta__item.project-meta__value--full {
      grid-column: 1 / -1;
    }

    .project-disciplines {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .project-discipline {
      display: inline-block;
      padding: 0.35rem 0.7rem;
      border: 1px solid rgba(206, 65, 39, 0.45);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg);
    }

    .project-detail-block {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .project-detail-block__title {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .project-detail-block__text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--fg);
    }

    .project-detail-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .project-detail-list li {
      position: relative;
      padding-left: 1rem;
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--fg);
    }

    .project-detail-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--fg);
      opacity: 0.65;
    }

    .project-outcomes {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .project-outcome {
      padding: 0.85rem 1rem;
      border-left: 3px solid var(--fg);
      background: rgba(206, 65, 39, 0.06);
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--fg);
    }

    @media (prefers-reduced-motion: reduce) {
      .project-accordion__panel,
      .project-accordion__content,
      .project-accordion__icon,
      .project-accordion__icon::before,
      .project-accordion__icon::after {
        transition: none;
      }
    }

    .project-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      padding-top: 0.25rem;
    }

    .project-view-button {
      display: inline-flex;
      padding: 0.9rem 1.75rem;
      background: transparent;
      color: var(--fg);
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none;
      border: 2px solid var(--fg);
      border-radius: 999px;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .project-view-button:hover {
      transform: translateY(-2px);
      background: var(--fg);
      color: var(--bg);
    }

    .project-back-link {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      opacity: 0.85;
    }

    .project-back-link:hover {
      opacity: 1;
    }

    .showreel {
      position: fixed;
      left: clamp(16px, 2vw, 32px);
      top: clamp(14px, 2.2vh, 28px);
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      color: var(--fg);
      text-decoration: none;
      z-index: 10;
      pointer-events: auto;
      background: rgba(247, 228, 145, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding-right: 0.25rem;
    }

    .showreel .icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      outline: 1.5px solid var(--border);
      background: #f7e491;
    }

    .showreel .play {
      width: 0;
      height: 0;
      border-right: 10px solid var(--fg);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      margin-right: 2px;
    }

    .showreel .label {
      font-weight: 600;
      letter-spacing: 0.06em;
      font-size: clamp(0.75rem, 1.1vw, 1rem);
      text-transform: uppercase;
    }

    .bottom-left {
      position: fixed;
      left: clamp(12px, 2.4vw, 48px);
      bottom: clamp(14px, 2.2vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 24px;
      z-index: 10;
      pointer-events: auto;
    }

    .logo-svg { width: 36px; height: auto; display: block; }
    .pills { display: flex; gap: clamp(10px, 1.2vw, 16px); flex-wrap: wrap; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1.1rem;
      border: 1.6px solid var(--fg);
      border-radius: 999px;
      background: #f7e491;
      color: var(--fg);
      font-weight: 600;
      letter-spacing: 0.05em;
      font-size: clamp(0.72rem, 0.95vw, 0.9rem);
      text-transform: uppercase;
      text-decoration: none;
    }
    .pill .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--fg); }
    .pill:hover { background: var(--fg); color: var(--bg); }

    .cursor-dot, .cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
    }
    .cursor-dot { width: 6px; height: 6px; border-radius: 50%; background: #CE4127; }
    .cursor-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #CE4127;
      opacity: 0.9;
    }

    .page-transition {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 99999;
      pointer-events: none;
      transform: translateY(100%);
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .page-transition.is-active { transform: translateY(0); pointer-events: all; }
    .page-transition.is-exiting { transform: translateY(-100%); }
    .page-transition.to-red { background: #ce4127; }

    @keyframes slideDown { from { transform: translateY(-100px); } to { transform: translateY(0); } }
    @keyframes slideRight { from { transform: translateX(-100px); } to { transform: translateX(0); } }
    @keyframes slideLeft { from { transform: translateX(100px); } to { transform: translateX(0); } }

    .showreel { transform: translateY(-100px); }
    .project-layout__left { transform: translateX(-80px); opacity: 0; }
    .project-layout__right { transform: translateX(80px); opacity: 0; }
    .bottom-left { transform: translateX(-100px) translateY(100px); }

    .showreel.animate-in { animation: slideDown 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards; }
    .project-layout__left.animate-in { animation: slideRight 1s cubic-bezier(0.4, 0, 0.2, 1) 0.25s forwards; }
    .project-layout__right.animate-in { animation: slideLeft 1s cubic-bezier(0.4, 0, 0.2, 1) 0.35s forwards; }
    .bottom-left.animate-in { animation: slideRight 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.45s forwards; }

    .project-layout__left.animate-in,
    .project-layout__right.animate-in {
      animation-fill-mode: forwards;
    }

    @keyframes slideRightFade {
      from { transform: translateX(-80px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideLeftFade {
      from { transform: translateX(80px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .project-layout__left.animate-in { animation-name: slideRightFade; }
    .project-layout__right.animate-in { animation-name: slideLeftFade; }

    @media (max-width: 1024px) {
      .project-layout {
        grid-template-columns: 1fr;
        gap: clamp(32px, 5vh, 48px);
      }

      .project-layout__right {
        position: static;
        max-height: none;
        overflow: visible;
      }

      .project-gallery__item--tall {
        grid-row: span 1;
      }

      .project-gallery__item:not(.project-gallery__item--contain):not(.project-gallery__item--wide) img,
      .project-gallery__item:not(.project-gallery__item--contain):not(.project-gallery__item--wide) video {
        aspect-ratio: 4 / 3;
      }
    }

    @media (max-width: 600px) {
      .project-gallery {
        grid-template-columns: 1fr;
      }

      .project-gallery__item--wide,
      .project-gallery__item--half,
      .project-gallery__item--third,
      .project-gallery__item:not(.project-gallery__item--wide):not(.project-gallery__item--half):not(.project-gallery__item--third) {
        grid-column: 1;
      }

      .project-meta {
        grid-template-columns: 1fr;
      }

      .project-actions .project-view-button {
        width: 100%;
        justify-content: center;
      }

      .showreel .label { display: none; }
    }

    @media (hover: none) {
      html, body { cursor: auto !important; }
      .cursor-dot, .cursor-ring { display: none !important; }
    }
  </style>

</head>

        <a class="pill" href="work.html"><i class="dot" aria-hidden="true"></i> Website</a>

        <a class="pill" href="About.html"><i class="dot" aria-hidden="true"></i> Our House</a>
        <a class="pill" href="contact.html"><i class="dot" aria-hidden="true"></i> Let's Talk</a>
      </nav>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
      </button>
    </div>
  </main>

  <div class="page-transition is-active" id="pageTransition"></div>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <script src="js/long-term-projects.js"></script>
  <script src="js/long-term-project-page.js"></script>
  <script>
    (function () {
      const dot = document.getElementById('cursorDot');
      const ring = document.getElementById('cursorRing');
      if (!dot || !ring) return;
      let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
      window.addEventListener('mousemove', (e) => {
        x = e.clientX;
        y = e.clientY;
        dot.style.transform = `translate(${x}px, ${y}px)`;
      }, { passive: true });
      (function tick() {
        rx += (x - rx) * 0.18;
        ry += (y - ry) * 0.18;
        ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
        requestAnimationFrame(tick);
      })();
      window.addEventListener('mousemove', (e) => {
        const target = e.target.closest('a, button, .pill, .showreel, .project-view-button, .project-accordion__trigger');
        ring.classList.toggle('is-hover', !!target);
      }, { passive: true });
    })();

    (function () {
      function setVh() {
        document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
    })();

    (function () {
      const transition = document.getElementById('pageTransition');
      if (!transition) return;
      window.addEventListener('load', () => {
        setTimeout(() => transition.classList.remove('is-active'), 100);
      });

      const pageColors = {
        'long-term.html': { bg: '#F7E491', text: '#CE4127' },
        'index.html': { bg: '#F7E491', text: '#CE4127' },
        'work.html': { bg: '#ce4127', text: '#F7E491' },
        'About.html': { bg: '#ce4127', text: '#ffffff' },
        'contact.html': { bg: '#F7E491', text: '#CE4127' }
      };

      document.querySelectorAll('a[href$=".html"], a[href*=".html?"]').forEach((link) => {
        link.addEventListener('click', function (e) {
          const href = this.getAttribute('href');
          if (!href || href.startsWith('http') || this.target === '_blank') return;
          e.preventDefault();
          const targetPage = href.split('/').pop().split('?')[0];
          const targetColor = pageColors[targetPage] || pageColors['index.html'];
          transition.classList.toggle('to-red', targetColor.bg === '#ce4127');
          transition.classList.add('is-active');
          setTimeout(() => { window.location.href = href; }, 1000);
        });
      });
    })();
  </script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
