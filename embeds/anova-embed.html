<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Anova — preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .55rem 1rem;
      background: #1a1a1a;
      color: #f5f5f5;
      font: 600 12px/1.3 Inter, system-ui, sans-serif;
      letter-spacing: .04em;
    }
    .note { margin: 0; opacity: .85; font-weight: 500; }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1.25rem;
      box-sizing: border-box;
      max-width: 1280px;
      margin: 0 auto;
    }
    .stack img {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
      box-shadow: 0 8px 28px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div class="bar">
    <p class="note">Anova — smart oven guide system preview</p>
  </div>
  <div class="stack">
    <img src="../Assets/anova/01-screen-grid.png" alt="Anova guide system screen grid" width="1280" />
    <img src="../Assets/anova/02-quad-flow.png" alt="Anova cook flow from preheat to finished" width="1280" />
    <img src="../Assets/anova/03-trio-journey.png" alt="Anova browse, recipe, and active cook" width="1280" />
    <img src="../Assets/anova/04-duo-cauliflower.png" alt="Anova recipe overview and texture selection" width="1280" />
  </div>
</body>
</html>
