<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>W3380 — preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    .preview {
      display: block;
      width: 1280px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .55rem 1rem;
      background: #111;
      color: #f2f2f2;
      font: 600 12px/1.3 Inter, system-ui, sans-serif;
      letter-spacing: .04em;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .bar a {
      color: #f7e491;
      text-decoration: none;
      border: 1px solid rgba(247, 228, 145, .45);
      padding: .35rem .7rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bar a:hover { background: rgba(247, 228, 145, .08); }
    .note {
      margin: 0;
      opacity: .85;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="bar">
    <p class="note">W3380 preview (live site blocks iframe embedding)</p>
    <a href="https://w3380-production.up.railway.app/" target="_blank" rel="noopener noreferrer">Open live site</a>
  </div>
  <img
    class="preview"
    src="../Assets/optimized/w3380-home.jpg"
    alt="W3380 site preview"
    width="1280"
  />
</body>
</html>
