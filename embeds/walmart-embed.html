<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Walmart — virtual fitting room preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .55rem 1rem;
      background: #0071dc;
      color: #fff;
      font: 600 12px/1.3 Inter, system-ui, sans-serif;
      letter-spacing: .04em;
    }
    .bar a {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.45);
      padding: .35rem .7rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bar a:hover { background: rgba(255,255,255,.1); }
    .note { margin: 0; opacity: .9; font-weight: 500; }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1.25rem;
      box-sizing: border-box;
      max-width: 1280px;
      margin: 0 auto;
    }
    .stack img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div class="bar">
    <p class="note">Walmart — virtual fitting room preview</p>
    <a href="https://www.walmart.ca/en" target="_blank" rel="noopener noreferrer">Open live site</a>
  </div>
  <div class="stack">
    <img src="../Assets/walmart/lifestyle/06-boutique-phones.png" alt="Boutique virtual try-on phones" width="1280" />
    <img src="../Assets/walmart/lifestyle/01-hand-phone.png" alt="Choose my model on phone" width="1280" />
    <img src="../Assets/walmart/lifestyle/02-shopper.png" alt="My Virtual Closet lifestyle" width="1280" />
    <img src="../Assets/walmart/lifestyle/03-welcome.png" alt="Fitting room welcome screen" width="1280" />
    <img src="../Assets/walmart/lifestyle/05-dual-phones.png" alt="Switch model dual phones" width="1280" />
    <img src="../Assets/walmart/lifestyle/04-mirror-phone.png" alt="Virtual closet in fitting room" width="1280" />
    <img src="../Assets/walmart/lifestyle/07-retail-duo.png" alt="Laptop and phone fitting room" width="1280" />
    <img src="../Assets/walmart/lifestyle/08-design-studio.png" alt="Virtual Dress Up design studio" width="1280" />
  </div>
</body>
</html>
