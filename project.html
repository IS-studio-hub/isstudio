<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Project case study — IS Studio Experience House." />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<title>IS - Experience House</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/scrollbars.css">


  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <style>
    :root{
      --bg: #F7E491;
      --fg: #CE4127;
      --muted: #CE4127;
      --border: rgba(206, 65, 39,1);
      --dot: #CE4127;
      --dot-glow: rgba(134, 59, 25, 1);
      --accent-img: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600&auto=format&fit=crop');
      --gutter: clamp(16px, 6vw, 140px);
      --toast-bg: rgba(255,255,255,.08);

      /* vh fallback var for older iOS */
      --vh: 1vh;
    }

    html {
      scroll-behavior: smooth;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      overflow: clip;
    }

    .screen {
      position: relative;
      width: 100vw;

      /* viewport height fixes */
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      height: calc(var(--vh) * 100);

      overflow: hidden;
      background: var(--bg);
      isolation: isolate;
    }

    /* CENTERED content area */
    .center{
      width: 100vw;
      position: absolute;
      inset: 0;
      display: grid;
      align-items: center;
      justify-items: center;
      text-align: center;
      pointer-events: none;
    }
    .stack {
      display: flex;
      gap: clamp(1rem, 3vh, 2rem);
      align-items: stretch;
      justify-items: center;
      text-align: center;
      pointer-events: auto;
      width: -webkit-fill-available;
      height: 100%;
      padding: 140px 32px 32px 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scroll-padding-top: 140px;
    }

    @media (max-width: 480px) {
      .stack {
        padding: 140px 16px 16px 16px;
      }
    }
    
    .eyebrow {
      position: relative; z-index: 2;
      letter-spacing: .18em;
      font-size: clamp(.7rem, 1.2vw, 1rem);
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: auto;
    }

    /* Project content area */
    .project-content {
      height: fit-content;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      padding-top: 32px;
      padding-bottom: 120px;
    }

    .project-video {
      width: 100%;
      /* height: 600px; */
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 24px rgb(0 0 0 / 30%);
      flex-shrink: 0;
    }

    .project-video video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .title-p {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      text-align: left;
      padding: 100px 0 150px 0;
    }
    
    /* Ensure video is visible */
    .project-video video:not([src]) {
      /* display: none; */
    }
    
    /* Responsive video height */
    @media (max-width: 768px) {
      .project-video {
        /* height: 400px; */
      }
    }
    
    @media (max-width: 480px) {
      .project-video {
        /* height: 300px; */
      }
    }

    .project-title {
      font-size: clamp(3rem, 8vw, 8rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #863B19;
      margin: 0;
      text-align: left;
      align-self: flex-start;
      width: 100%;
    }

    .project-number {
      font-size: clamp(1rem, 2vw, 1.5rem);
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .project-tagline {
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 500;
      line-height: 1.4;
      color: #863B19;
      margin: 0.5rem 0 1rem 0;
      text-align: left;
      align-self: flex-start;
      width: 100%;
      opacity: 0.85;
      font-style: italic;
    }

    .project-description {
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      line-height: 1.6;
      color: #863B19;
      max-width: 600px;
      opacity: 0.9;
      text-align: left;
      align-self: flex-start;
      width: 100%;
    }

    /* top-left showreel */
    .showreel {
      position: absolute; left: clamp(16px, 2vw, 32px); top: clamp(14px, 2.2vh, 28px);
      display: inline-flex; align-items: center; gap: .9rem;
      color: var(--fg);
      cursor: none !important;
      pointer-events: auto;
      user-select: none;
      text-decoration: none;
      z-index: 3;
    }
    /* Hover animation for back icon - move left then return */
    @keyframes playIconHover {
      0% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(-20px);
      }
      51% {
        transform: translateX(20px);
      }
      100% {
        transform: translateX(0);
      }
    }

    .showreel .icon {
      width: 46px; height: 46px; border-radius: 10px;
      position: relative; display: grid; place-items: center;
      outline: 1.5px solid var(--border);
      background-color: #f7e491;
      transition: transform .15s ease;
    }
    .showreel .icon::before {
      content: ""; position: absolute; inset: 0;
      border: 1.5px dashed rgba(206, 65, 39,.25);
      border-radius: 10px;
      transform: scale(.86);
    }
    .showreel .play {
      width: 0; height: 0;
      border-right: 10px solid var(--fg);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      margin-right: 2px;
      transition: none;
    }

    .showreel:hover .play {
      animation: playIconHover 0.6s ease-out;
    }
    .showreel span.label{
      font-weight: 600;
      letter-spacing: .06em;
      font-size: clamp(.75rem, 1.1vw, 1rem);
      text-transform: uppercase;
      opacity: .95;
    }
    .showreel:hover .icon{ 
      transform: scale(1.04); 
    }

    /* bottom-left: logo + pills */
    .bottom-left {
      margin-bottom: 24px;
      position: absolute; left: clamp(12px, 2.4vw, 48px); bottom: clamp(14px, 2.2vh, 28px);
      display: flex; align-items: flex-end; gap: 24px;
      z-index: 2;
      pointer-events: auto;
      cursor: none !important;
    }
    .logo-svg { width: 36px; height: auto; display: block; }

    .pills { display: flex; gap: clamp(10px, 1.2vw, 16px); flex-wrap: wrap; }
    .pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1.1rem;
      border: 1.6px solid var(--fg);
      border-radius: 999px;
      background: #f7e491;
      color: var(--fg);
      font-weight: 600;
      letter-spacing: .05em;
      font-size: clamp(.72rem, .95vw, .9rem);
      text-transform: uppercase;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, transform .12s ease, border-color .2s ease;
      cursor: none !important;
    }
    .pill .dot{ width: .45rem; height: .45rem; border-radius: 50%; background: var(--fg); }
    .pill:hover { background: var(--fg); color: var(--bg); transform: translateY(-1px); }
    .pill:hover .dot{ background: var(--bg); }

    /* bottom-right rock wedge */
    .wedge {
      position: absolute; right: -6vw; bottom: -10vh;
      width: min(64vw, 1100px);
      height: min(42vh, 480px);
      background-image: var(--accent-img);
      background-size: cover; background-position: center;
      filter: grayscale(1) contrast(1.2) brightness(.9);
      opacity: .9;
      clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%, 8% 62%);
      transform: rotate(-2deg);
      pointer-events: none;
      z-index: 0;
    }

    :focus-visible { outline: 2px dashed #fff; outline-offset: 3px; }

    /* under 520px tweaks */
    @media (max-width: 520px){
      :root{ --gutter: clamp(12px, 5vw, 24px); }
      .showreel span.label{ display:none; }
    }

    /* under 470px → mobile hamburger nav (see css/mobile-nav.css) */

    /* Hide the toast completely */
    .toast { display: none !important; }

    /* ---------- Custom cursor (desktop only) ---------- */
    html, body, a, button, [role="button"], input, textarea, select, .pill, .showreel {
      cursor: none !important;
    }

    .cursor-dot, .cursor-ring {
      position: fixed;
      top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
    }
    .cursor-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #CE4127;
      mix-blend-mode: normal;
    }
    .cursor-ring {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid #CE4127;
      transition: width .15s ease, height .15s ease, opacity .15s ease, transform .15s ease;
      opacity: .9;
    }
    .cursor-ring.is-hover {
      transform: translate(-50%, -50%) scale(1.15);
      opacity: 1;
    }
    /* top-right coords HUD */
    .coords{
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 9998;
      pointer-events: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      color: rgba(206,65,39,.75);
      text-align: right;
      letter-spacing: .02em;
    }
    .coords b{ color: #CE4127; font-weight: 600; }
    @media (hover: none) {
      .cursor-dot, .cursor-ring { display: none !important; }
      html, body { cursor: auto !important; }
    }
    @media (prefers-reduced-motion: reduce){
      .cursor-ring { transition: none; }
    }

    /* Sticky Stack Component Styles (like creativewebmanual.com) */
    .examples-section {
      width: 100%;
      /* padding: clamp(28px, 6vw, 72px) 0; */
      /* background: #0b0b0c; */
      color: #863b19;
      /* margin-top: 2rem; */
      border-radius: 0;
      /* min-height: calc(100vh * 3.2); */
    }

    .pin-spacer {
      order: 0;
      place-self: auto;
      grid-area: auto;
      z-index: auto;
      float: none;
      flex-shrink: 1;
      display: grid;
      margin: 0px;
      inset: 0px auto auto 0px;
      position: relative;
      flex-basis: auto;
      overflow: visible;
      box-sizing: border-box;
      width: 100%;
    }

    .examples__right-content {
      padding: 10vw;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: sticky;
      top: 0;
    }

    .examples__grid {
      display: flex;
      gap: clamp(24px, 4vw, 56px);
      align-items: start;
      translate: none;
      rotate: none;
      scale: none;
      inset: 0px auto auto 0px;
      margin: 0px;
      /* max-width: 334px; */
      /* width: 334px; */
      /* max-height: 2051.59px; */
      height: fit-content;
      padding: 0px;
      transform: translate(0px, 0px);
    }

    .examples__left {
      overflow: hidden;
      /* border-radius: 14px; */
      width: 50%;
      position: sticky;
      top: 0;
    }

    .examples__right {
      height: -webkit-fill-available;
      width: 50%;
      position: sticky;
      top: 0;
      align-self: start;
      text-align: left;
    }

    .examples__right h2 {
      text-align: left;
      margin: 0 0 18px;
      font-size: clamp(42px, 4.5vw, 86px);
      letter-spacing: -0.02em;
      line-height: .95;
      color: #ce4027;
      font-weight: 700;
    }

    .examples__right p {
      text-align: left;
      margin: 0;
      max-width: 46ch;
      font-size: clamp(16px, 1.35vw, 22px);
      line-height: 1.45;
      color: rgb(206 64 39);
    }

    .project-description-text {
      text-align: left;
      margin: 0 0 2rem 0;
      max-width: 46ch;
      font-size: clamp(16px, 1.35vw, 22px);
      line-height: 1.6;
      color: rgb(134 59 25);
    }

    .project-description-text p {
      margin: 0 0 1rem 0;
    }

    .project-description-text p:last-child {
      margin-bottom: 0;
    }

    .project-tag {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: capitalize;
      color: rgb(206 64 39);
      font-weight: 600;
      margin-bottom: 0.5rem;
      opacity: 0.8;
      text-align: left;
    }

    .project-brand-title {
      font-size: clamp(32px, 4vw, 64px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #ce4027;
      margin: 0 0 1.5rem 0;
      text-align: left;
    }

    .project-business-description {
      font-size: 16px;
      line-height: 1.7;
      color: rgb(206 64 39);
      margin: 0 0 2rem 0;
      max-width: 100%;
      text-align: left;
    }

    .project-view-button {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: transparent;
      color: #ce4027;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-decoration: none;
      border: 2px solid #ce4027;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .project-view-button:hover {
      transform: translateY(-2px);
      background: #ce4027;
      color: #F7E491;
    }

    .project-view-button:active {
      transform: translateY(0);
    }

    .project-actions {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.5rem;
      width: 100%;
    }

    .project-details-button {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      padding: 0;
      background: none;
      border: 0;
      color: #ce4027;
      font-size: 15px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0.02em;
      text-decoration: underline;
      text-underline-offset: 0.2em;
      cursor: pointer;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .project-details-button:hover {
      opacity: 0.75;
      color: #863b19;
    }

    .project-details-button:focus-visible {
      outline: 2px solid #ce4027;
      outline-offset: 4px;
    }

    body.details-drawer-open {
      overflow: hidden !important;
    }

    body.details-drawer-open .cursor-dot,
    body.details-drawer-open .cursor-ring {
      z-index: 10001;
    }

    .details-drawer,
    .details-drawer * {
      cursor: none !important;
    }

    .details-drawer {
      position: fixed;
      inset: 0;
      z-index: 10000;
      pointer-events: none;
      visibility: hidden;
    }

    .details-drawer.is-open {
      pointer-events: auto;
      visibility: visible;
    }

    .details-drawer__backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .details-drawer.is-open .details-drawer__backdrop {
      opacity: 1;
    }

    .details-drawer__panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: min(480px, 100vw);
      background: #ffffff;
      color: #A82F18;
      box-shadow: -18px 0 48px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
    }

    .details-drawer.is-open .details-drawer__panel {
      transform: translateX(0);
    }

    .details-drawer__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: max(clamp(1.25rem, 3vw, 1.75rem), env(safe-area-inset-top)) clamp(1.25rem, 3vw, 1.75rem) 1rem;
      border-bottom: 1px solid rgba(168, 47, 24, 0.18);
      flex-shrink: 0;
    }

    .details-drawer__eyebrow {
      margin: 0 0 0.35rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(168, 47, 24, 0.7);
    }

    .details-drawer__title {
      margin: 0;
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #A82F18;
    }

    .details-drawer__close {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 1.5px solid #A82F18;
      border-radius: 50%;
      background: transparent;
      color: #A82F18;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .details-drawer__close:hover {
      background: #A82F18;
      color: #ffffff;
    }

    .details-drawer__body {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      padding: 0.5rem clamp(1.25rem, 3vw, 1.75rem) clamp(1.75rem, 4vh, 2.5rem);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(168, 47, 24, 0.35) transparent;
    }

    .details-drawer__tagline {
      margin: 0 0 1.25rem;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.4;
      color: #A82F18;
    }

    .details-drawer__accordion {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(168, 47, 24, 0.2);
    }

    .details-drawer__item {
      border-bottom: 1px solid rgba(168, 47, 24, 0.2);
    }

    .details-drawer__trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 0;
      margin: 0;
      border: 0;
      background: none;
      color: #A82F18;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .details-drawer__trigger:hover {
      opacity: 0.7;
    }

    .details-drawer__icon {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      position: relative;
    }

    .details-drawer__icon::before,
    .details-drawer__icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 1.5px;
      background: currentColor;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .details-drawer__icon::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .details-drawer__item.is-open .details-drawer__icon::after {
      transform: translate(-50%, -50%) rotate(90deg) scaleX(0);
      opacity: 0;
    }

    .details-drawer__acc-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .details-drawer__item.is-open .details-drawer__acc-panel {
      grid-template-rows: 1fr;
    }

    .details-drawer__content {
      overflow: hidden;
      min-height: 0;
      padding-bottom: 0;
      transition: padding-bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .details-drawer__item.is-open .details-drawer__content {
      padding-bottom: 1rem;
    }

    .details-drawer__text {
      margin: 0 0 0.75rem;
      font-size: 0.9rem;
      line-height: 1.65;
      color: #A82F18;
    }

    .details-drawer__text:last-child {
      margin-bottom: 0;
    }

    .details-drawer__list {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 0.45rem;
    }

    .details-drawer__list li {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #A82F18;
    }

    @media (max-width: 520px) {
      .details-drawer__panel {
        width: 100vw;
      }

      .project-actions {
        gap: 0.65rem 1rem;
      }

      .project-actions .project-details-button {
        text-align: left;
      }
    }

    .dropdown-container {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .dropdown {
      border-top: 1px solid rgba(134, 59, 25, 0.2);
      border-bottom: 1px solid rgba(134, 59, 25, 0.2);
    }

    .dropdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s ease;
    }

    .dropdown-header:hover {
      opacity: 0.7;
    }

    .dropdown-title {

    /* Page load animations */
    /* Page load animations - Slide in from different directions */
    @keyframes slideDown {
      from {
        transform: translateY(-100px);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100px);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes slideRight {
      from {
        transform: translateX(-100px);
      }
      to {
        transform: translateX(0);
      }
    }

    @keyframes slideLeft {
      from {
        transform: translateX(100px);
      }
      to {
        transform: translateX(0);
      }
    }

    /* Initially position elements off-screen */
    .showreel {
      transform: translateY(-100px);

    .center {
      transform: translateX(-100px);
    }

    .bottom-left {
      transform: translateX(-100px) translateY(100px);
    }

    .examples__left {
      transform: translateX(-150px);
    }

    .examples__right {
      transform: translateX(150px);
    }

    /* Animate in on load */
    .showreel.animate-in {
      animation: slideDown 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards;
    }

    .center.animate-in {
      animation: slideRight 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;

    .bottom-left.animate-in {
      animation: slideRight 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;

    .examples__left.animate-in {

    /* Page Transition Overlay */
    .page-transition {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg); /* Default to current page background */
      z-index: 99999;
      pointer-events: none;
      transform: translateY(100%);
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.1s ease;
    }
    
    /* Red background when transitioning to work.html */
    .page-transition.to-red {
      background: #ce4127;
    }
    
    /* Yellow background when transitioning to yellow pages */
    .page-transition.to-yellow {
      background: #F7E491;
    }

    .page-transition.to-dark {
      background: #060605;
    }

    .page-transition.is-active {
      transform: translateY(0);
      pointer-events: all;
    }

    .page-transition.is-exiting {
      transform: translateY(-100%);
    }

    /* Elements change color as overlay covers them */
    body.transitioning .showreel,
    body.transitioning .center,
    body.transitioning .bottom-left,
    body.transitioning .coords,
    body.transitioning .examples__right,
    body.transitioning .examples__left {
      transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1),

                  stroke 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    body.transitioning .showreel *,

    function escapeDrawerHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function renderDrawerParagraphs(items) {
      if (!items || !items.length) return '';
      return items
        .filter(Boolean)
        .map((text) => `<p class="details-drawer__text">${escapeDrawerHtml(text)}</p>`)
        .join('');

    function renderDrawerList(items) {
      if (!items || !items.length) return '';
      return `

        </ul>
      `;
    }

    function renderDrawerAccordionItem(id, title, content, openByDefault) {
      if (!content || !String(content).trim()) return '';
      const isOpen = !!openByDefault;
      return `
        <div class="details-drawer__item${isOpen ? ' is-open' : ''}">
          <button
            type="button"
            class="details-drawer__trigger"
            aria-expanded="${isOpen}"
            aria-controls="drawer-panel-${id}"
            id="drawer-trigger-${id}"
          >
            <span>${escapeDrawerHtml(title)}</span>
            <span class="details-drawer__icon" aria-hidden="true"></span>
          </button>
          <div
            class="details-drawer__acc-panel"
            id="drawer-panel-${id}"
            role="region"
            aria-labelledby="drawer-trigger-${id}"
            aria-hidden="${isOpen ? 'false' : 'true'}"
          >
            <div class="details-drawer__content">
              ${content}
            </div>
          </div>
        </div>
      `;
    }

    function getDrawerChallenge(project) {
      if (project.challenge) return project.challenge;
      const started = project.howItStarted && project.howItStarted.content;
      if (started && started[0]) return started[0];
      return (project.howItStarted && project.howItStarted.description) || '';
    }

    function getDrawerApproach(project) {
      if (project.approach) return project.approach;
      const started = project.howItStarted && project.howItStarted.content;
      if (started && started.length > 2) return started[2];
      const process = project.process && project.process.content;
      if (process && process.length) return process[0];
      return (project.process && project.process.description) || '';
    }

    function getDrawerProcess(project) {
      if (project.processHighlights && project.processHighlights.length) return project.processHighlights;
      return (project.process && project.process.content) || [];
    }

    function getDrawerDeliverables(project) {
      if (project.deliverables && project.deliverables.length) return project.deliverables;
      return (project.assets && project.assets.content) || [];
    }

    function getDrawerOutcomes(project) {
      if (project.outcomes && project.outcomes.length) return project.outcomes;
      return (project.finalResult && project.finalResult.content) || [];
    }

    function buildDetailsDrawerBody(project) {
      const sections = [];
      let first = true;

      const push = (id, title, content) => {
        const html = renderDrawerAccordionItem(id, title, content, first);
        if (html) {
          sections.push(html);
          first = false;
        }
      };

      push(
        'overview',
        'Overview',
        project.businessDescription
          ? `<p class="details-drawer__text">${escapeDrawerHtml(project.businessDescription)}</p>`
          : ''
      );

      push('details', 'Project Details', renderDrawerParagraphs(project.projectDescription));

      const challenge = getDrawerChallenge(project);
      push(
        'challenge',
        'The Challenge',
        challenge ? `<p class="details-drawer__text">${escapeDrawerHtml(challenge)}</p>` : ''
      );

      const approach = getDrawerApproach(project);
      push(
        'approach',
        'Approach',
        approach ? `<p class="details-drawer__text">${escapeDrawerHtml(approach)}</p>` : ''
      );

      push('process', 'Process Highlights', renderDrawerList(getDrawerProcess(project)));
      push('deliverables', 'Key Deliverables', renderDrawerList(getDrawerDeliverables(project)));
      push('outcomes', 'Impact & Outcomes', renderDrawerList(getDrawerOutcomes(project)));

      const tagline = project.tagline
        ? `<p class="details-drawer__tagline">${escapeDrawerHtml(project.tagline)}</p>`
        : '';

      return `
        ${tagline}
        <div class="details-drawer__accordion" id="detailsDrawerAccordion">
          ${sections.join('')}
        </div>
      `;
    }

    function initDetailsDrawerAccordion(container) {
      if (!container) return;
      const items = Array.from(container.querySelectorAll('.details-drawer__item'));

      const setPanelState = (item, open) => {
        const panel = item.querySelector('.details-drawer__acc-panel');
        const trigger = item.querySelector('.details-drawer__trigger');
        if (!panel || !trigger) return;
        trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.setAttribute('aria-hidden', open ? 'false' : 'true');
        item.classList.toggle('is-open', open);
      };

      items.forEach((item) => {
        const trigger = item.querySelector('.details-drawer__trigger');
        if (!trigger) return;
        trigger.addEventListener('click', () => {
          const wasOpen = item.classList.contains('is-open');
          items.forEach((other) => setPanelState(other, false));
          if (!wasOpen) setPanelState(item, true);
        });
      });
    }

    function initDetailsDrawer() {
      const drawer = document.getElementById('detailsDrawer');
      if (!drawer || drawer.dataset.bound === '1') return;
      drawer.dataset.bound = '1';

      let closeTimer = null;

      const closeDrawer = () => {
        drawer.classList.remove('is-open');
        drawer.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('details-drawer-open');
        if (closeTimer) clearTimeout(closeTimer);
        closeTimer = setTimeout(() => {
          drawer.hidden = true;
        }, 400);
      };

      drawer.querySelectorAll('[data-details-close]').forEach((el) => {
        el.addEventListener('click', closeDrawer);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawer.classList.contains('is-open')) {
          closeDrawer();
        }
      });

      window.closeDetailsDrawer = closeDrawer;
      window.openDetailsDrawer = (project) => {
        const body = document.getElementById('detailsDrawerBody');
        const title = document.getElementById('detailsDrawerTitle');
        if (!body || !project) return;

        if (closeTimer) {
          clearTimeout(closeTimer);
          closeTimer = null;
        }

        if (title) title.textContent = project.name || 'Project';
        body.innerHTML = buildDetailsDrawerBody(project);
        initDetailsDrawerAccordion(document.getElementById('detailsDrawerAccordion'));

        drawer.hidden = false;
        drawer.setAttribute('aria-hidden', 'false');
        document.body.classList.add('details-drawer-open');
        requestAnimationFrame(() => {
          drawer.classList.add('is-open');
        });
        drawer.querySelector('.details-drawer__close')?.focus();
      };
    }

    initDetailsDrawer();

    // Helper function to generate single large image HTML from media array (only first item)
    const generateGallery = (mediaArray, altText) => {
      // Use placeholder if no media array or empty
      const placeholderImage = 'https://via.placeholder.com/1200x800/863B19/F7E491?text=Project+Image';
      
      // Get first item or use placeholder
      let item = null;
      if (mediaArray && mediaArray.length > 0) {
        item = mediaArray[0];
      } else {
        item = { type: 'image', src: placeholderImage, alt: altText || 'Project image' };
      }
      
      return `
        <div class="gallery">
          ${(() => {
            // Handle YouTube videos
            if (item.type === 'youtube' || (item.src && item.src.includes('youtube.com/embed'))) {
              return `
                <div class="gallery-item">
                  <iframe src="${encodeURI(item.src)}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                </div>
              `;
            } 
            // Handle local video files (will loop automatically)
            else if (item.type === 'video' || (item.src && (item.src.endsWith('.mp4') || item.src.endsWith('.mov') || item.src.endsWith('.webm')))) {
              return `
                <div class="gallery-item">
                  <video autoplay loop muted playsinline preload="auto">
                    <source src="${encodeURI(item.src)}" type="video/mp4">
                    <source src="${encodeURI(item.src)}" type="video/quicktime">
                    <source src="${encodeURI(item.src)}" type="video/webm">
                  </video>
                </div>
              `;
            } 
            // Handle images and GIFs (GIFs loop automatically by nature)
            else {
              const isGif = item.src && (item.src.toLowerCase().endsWith('.gif') || item.src.toLowerCase().includes('.gif'));
              return `
                <div class="gallery-item">
                  <img src="${encodeURI(item.src)}" alt="${item.alt || altText || 'Project image'}" loading="lazy" ${isGif ? 'class="gif-image"' : ''} />
                </div>
              `;
            }
          })()}
        </div>
      `;

          ></iframe>

    function hideIframeScrollbars(iframe) {
      if (!iframe) return;
      const apply = () => {
        try {
          const doc = iframe.contentDocument;
          if (!doc || !doc.documentElement) return;
          if (doc.getElementById('hide-iframe-scrollbars')) return;
          const style = doc.createElement('style');
          style.id = 'hide-iframe-scrollbars';
          style.textContent = [
            'html, body { scrollbar-width: none !important; -ms-overflow-style: none !important; }',
            'html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; background: transparent !important; }'
          ].join('');
          (doc.head || doc.documentElement).appendChild(style);
        } catch (_) {
          /* cross-origin iframes cannot be styled */
        }
      };
      apply();
      iframe.addEventListener('load', apply);
    }

    function fitLivePreview(root) {
      const wrap = root.querySelector('.examples__live-site');
      const scaler = root.querySelector('.live-site-frame-scaler');
      if (!wrap || !scaler) return;
      const w = wrap.clientWidth;
      if (w < 1) return;
      const scale = w / 1280;
      scaler.dataset.fitScale = '1';
      scaler.style.transform = 'scale(' + scale + ')';
      wrap.style.height = (w * 720 / 1280) + 'px';
      hideIframeScrollbars(root.querySelector('.live-site-frame'));
    }

    function mountSrcdocEmbed(project, root) {
      const iframe = root.querySelector('.live-site-frame[data-live-srcdoc]');
      if (!iframe || !project.liveEmbedScript) return;

      const applyHtml = (html) => {
        if (!html) return;
        const desktopHtml = html.replace(
          /content="width=device-width,\s*initial-scale=1"/i,
          'content="width=1280, initial-scale=1"'
        );
        iframe.srcdoc = desktopHtml;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => fitLivePreview(root));
        });
      };

      const useIframeFile = () => {
        if (!project.liveEmbedPath) return false;
        iframe.removeAttribute('data-live-srcdoc');
        iframe.src = new URL(project.liveEmbedPath, document.baseURI || window.location.href).href;
        return true;
      };

      if (window.OZINT_EMBED_HTML) {
        applyHtml(window.OZINT_EMBED_HTML);
        return;
      }

      const script = document.createElement('script');
      script.src = new URL(project.liveEmbedScript, document.baseURI || window.location.href).href;
      script.onload = () => applyHtml(window.OZINT_EMBED_HTML);
      script.onerror = () => {
        if (!useIframeFile()) {
          iframe.srcdoc = '<!DOCTYPE html><html><body style="margin:0;background:#0a0a0a;color:#f2f2f2;font:14px/1.5 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;padding:1.5rem;text-align:center"><p>Preview unavailable. <a href="' + project.liveSiteUrl + '" target="_blank" rel="noopener" style="color:#f7e491">Open live site</a></p></body></html>';

      };
      document.head.appendChild(script);

              ${project.liveSiteUrl ? `
              <div class="examples__live-site">
                ${generateLiveSiteEmbed(project)}
              </div>
              ` : `
              <div class="examples__collection">
                <div class="examples__item" data-item-index="0">
                  <div class="examples__item-content">${generateSectionGallery(project, 'howItStarted')}</div>
                </div>
                <div class="examples__item" data-item-index="1">
                  <div class="examples__item-content">${generateSectionGallery(project, 'process')}</div>
                </div>
                <div class="examples__item" data-item-index="2">
                  <div class="examples__item-content">${generateSectionGallery(project, 'assets')}</div>
                </div>
                <div class="examples__item" data-item-index="3">
                  <div class="examples__item-content">${generateSectionGallery(project, 'finalResult')}</div>
                </div>
              </div>
              `}
            </div>

            <!-- RIGHT COLUMN -->
            <div class="examples__right">
              <div class="examples__right-content">
              <div class="project-tag">Campaign Site</div>
              <h2 class="project-brand-title">${project.name}</h2>
              <div class="project-business-description">
                ${project.businessDescription || 'A comprehensive digital platform designed to elevate brand presence and drive meaningful engagement. Through innovative design and strategic development, we created a solution that connects with audiences and delivers measurable results.'}
              </div>
              <div class="project-actions">
                <a href="${project.liveSiteUrl || '#'}" class="project-view-button"${project.liveSiteUrl ? ' target="_blank" rel="noopener noreferrer"' : ''}>View the Result</a>
                <button type="button" class="project-details-button" data-details-drawer-open>God Is in the Small Details</button>
              </div>
            </div>
            </div>
          </div>
        </section>
      `;

      // Update page title
      document.title = `${project.name} - IS Experience House`;

      const detailsBtn = contentEl.querySelector('[data-details-drawer-open]');
      if (detailsBtn) {
        detailsBtn.addEventListener('click', (e) => {
          e.preventDefault();
          if (typeof window.openDetailsDrawer === 'function') {
            window.openDetailsDrawer(project);
          }
        });
      }

      if (project.liveEmbedScript) {
        mountSrcdocEmbed(project, contentEl);
      }
      if (project.liveSiteUrl) {
        const scheduleFit = () => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => fitLivePreview(contentEl));
          });
        };
        scheduleFit();
        window.addEventListener('resize', scheduleFit);
        if (typeof ResizeObserver !== 'undefined') {
          const wrap = contentEl.querySelector('.examples__live-site');
          if (wrap) new ResizeObserver(scheduleFit).observe(wrap);
        }
      }

      // Animate examples sections after content loads
      setTimeout(() => {
        const examplesLeft = document.querySelector('.examples__left');
        const examplesRight = document.querySelector('.examples__right');
        if (examplesLeft) examplesLeft.classList.add('animate-in');
        if (examplesRight) examplesRight.classList.add('animate-in');
      }, 100);
      
      // Initialize scroll-based accordion functionality with scroll pinning
      setTimeout(() => {
        const examplesSection = contentEl.querySelector('.examples-section');
        const examplesGrid = contentEl.querySelector('.examples__grid');
        const accordionItems = Array.from(contentEl.querySelectorAll('.examples__item'));
        const totalItems = accordionItems.length;
        
        if (!examplesSection || !examplesGrid || totalItems === 0) return;
        
        // Ensure all videos are loaded and ready
        const videos = contentEl.querySelectorAll('.examples__item video');
        videos.forEach(video => {
          video.load();
          video.play().catch(() => {});
        });
      }, 300);

    }
    
    // Trigger animations after content is loaded
    requestAnimationFrame(() => {
      setTimeout(() => {
        const showreel = document.querySelector('.showreel');
        const center = document.querySelector('.center');
        const bottomLeft = document.querySelector('.bottom-left');
        
        if (showreel) showreel.classList.add('animate-in');
        if (center) center.classList.add('animate-in');
        if (bottomLeft) bottomLeft.classList.add('animate-in');
        
        // Animate examples sections
        const examplesLeft = document.querySelector('.examples__left');
        const examplesRight = document.querySelector('.examples__right');
        if (examplesLeft) examplesLeft.classList.add('animate-in');
        if (examplesRight) examplesRight.classList.add('animate-in');
      }, 100);
    });

    // Back button navigation handled by href

    /* -------- Custom cursor logic -------- */
    (function(){
      const dot  = document.getElementById('cursorDot');
      const ring = document.getElementById('cursorRing');

      if (!dot || !ring) return;

      let x = window.innerWidth / 2, y = window.innerHeight / 2;
      let rx = x, ry = y;
      const ease = 0.18;

      function move(e){
        x = e.clientX;
        y = e.clientY;
        dot.style.transform  = `translate(${x}px, ${y}px)`;
      }

      function tick(){
        rx += (x - rx) * ease;
        ry += (y - ry) * ease;
        ring.style.transform = `translate(${rx - 0}px, ${ry - 0}px) translate(-50%, -50%)`;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      window.addEventListener('mousemove', move, {passive:true});
      // coords HUD
      (function(){
        const mx = document.getElementById('mx');
        const my = document.getElementById('my');
        if (!mx || !my) return;
        window.addEventListener('mousemove', (e) => {
          mx.textContent = Math.round(e.clientX);
          my.textContent = Math.round(e.clientY);
        }, { passive: true });
      })();

      function updateHover(e){
        const target = e.target.closest('a, button, [role="button"], .pill, .showreel, input, select, textarea, label');
        ring.classList.toggle('is-hover', !!target);
      }
      window.addEventListener('mousemove', updateHover, {passive:true});

      window.addEventListener('mousedown', ()=> ring.style.opacity = '0.7');
      window.addEventListener('mouseup',   ()=> ring.style.opacity = '0.9');

      window.addEventListener('mouseleave', ()=> {
        dot.style.opacity = '0'; ring.style.opacity = '0';
      });
      window.addEventListener('mouseenter', ()=> {
        dot.style.opacity = '1'; ring.style.opacity = '0.9';
      });
    })();

    /* Set --vh to innerHeight for older Safari/Chrome on iOS */
    (function(){
      function setVh(){
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
    })();

    /* Smooth scroll enhancement for anchor links */
    (function() {
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          const href = this.getAttribute('href');
          if (href === '#' || href === '#contact' || href === '#work') {
            e.preventDefault();
            const target = document.querySelector(href);
            if (target) {
              target.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
              });
            }
          }
        });
      });
    })();

    /* Cutting-Edge Page Transitions */
    (function() {
      const transition = document.getElementById('pageTransition');
      if (!transition) return;

      // Check if page is loading
      if (document.readyState === 'loading') {
        document.body.classList.add('page-loading');
        window.addEventListener('load', () => {
          setTimeout(() => {
            document.body.classList.remove('page-loading');
            transition.classList.remove('is-active');
          }, 100);
        });
      } else {
        // Page already loaded, fade in transition
        setTimeout(() => {
          transition.classList.remove('is-active');
        }, 100);
      }

      // Page color mapping
      const pageColors = {
        'work.html': { bg: '#ce4127', text: '#FFFFFF' }, // Red page
        'index.html': { bg: '#F7E491', text: '#CE4127' }, // Yellow page
        'project.html': { bg: '#F7E491', text: '#CE4127' }, // Yellow page
        'About.html': { bg: '#ce4127', text: '#FFFFFF' },
        'contact.html': { bg: '#F7E491', text: '#CE4127' },
      };

      // Intercept all internal navigation links
      document.querySelectorAll('a[href$=".html"], a[href*=".html?"]').forEach(link => {
        link.addEventListener('click', function(e) {
          const href = this.getAttribute('href');
          // Skip if it's an external link or has target="_blank"
          if (href.startsWith('http') || this.target === '_blank' || href.startsWith('mailto:')) {
            return;
          }

          e.preventDefault();
          
          // Extract target page name
          const targetPage = href.split('/').pop().split('?')[0];
          const targetColor = pageColors[targetPage] || pageColors['index.html'];
          const currentBg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
          const isCurrentRed = currentBg === '#ce4127' || currentBg === 'rgb(206, 65, 39)';
          const isTargetRed = targetColor.bg === '#ce4127';
          const isTargetDark = targetColor.bg === '#060605';
          
          transition.classList.remove('to-red', 'to-yellow', 'to-dark');
          if (isTargetRed) {
            transition.classList.add('to-red');
          } else if (isTargetDark) {
            transition.classList.add('to-dark');
          } else {
            transition.classList.add('to-yellow');
          }
          
          // Add transitioning class
          document.body.classList.add('transitioning');
          
          // Function to update element colors based on overlay position
          function updateColors() {
            const overlayRect = transition.getBoundingClientRect();
            const overlayTop = overlayRect.top;
            
            // Elements to update
            const elements = document.querySelectorAll('.showreel, .center, .bottom-left, .coords, .examples__right, .examples__left, .showreel *, .center *, .bottom-left *, .coords *, .examples__right *, .examples__left *, svg path, .pill, .pill *');
            
            elements.forEach(el => {
              const elRect = el.getBoundingClientRect();
              const elBottom = elRect.bottom;
              
              // If element is covered by overlay
              if (elBottom <= overlayTop + 5) {
                const computedStyle = window.getComputedStyle(el);
                
                // Change text color to target page's text color
                if (computedStyle.color && computedStyle.color !== 'rgba(0, 0, 0, 0)' && computedStyle.color !== 'transparent') {
                  el.style.color = targetColor.text;
                }
                
                // Change SVG fill
                if (el.tagName === 'path') {
                  el.style.fill = targetColor.text;
                }
                
                // Change border color
                if (computedStyle.borderColor && computedStyle.borderColor !== 'rgba(0, 0, 0, 0)' && computedStyle.borderColor !== 'transparent') {
                  el.style.borderColor = targetColor.text;
                }
                
                // Change outline color
                if (el.classList.contains('showreel') || el.closest('.showreel')) {
                  el.style.outlineColor = targetColor.text;
                }
              }
            });
          }
          
          // Update colors as overlay animates
          let animationFrameId;
          function animateColors() {
            if (transition.classList.contains('is-active')) {
              updateColors();
              animationFrameId = requestAnimationFrame(animateColors);
            } else {
              cancelAnimationFrame(animationFrameId);
            }
          }
          animateColors();
          
          // Show transition overlay (slide up from bottom)
          transition.classList.add('is-active');
          
          // Navigate after transition completes
          setTimeout(() => {
            window.location.href = href;
          }, 1000);
        });
      });

      // Handle browser back/forward buttons
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) {
          // Page was loaded from cache
          transition.classList.remove('is-active');
        }
      });

      window.addEventListener('popstate', () => {
        transition.classList.add('is-active');
        setTimeout(() => {
          transition.classList.remove('is-active');
        }, 600);
      });
    })();
  </script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
